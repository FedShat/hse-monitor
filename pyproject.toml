[project]
name = "hse-monitor"
version = "0.1.0"
description = "SmartLMS English exam slots monitor and Telegram bot"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
