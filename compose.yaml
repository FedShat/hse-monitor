services:
  monitor:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    volumes:
      - monitor-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  monitor-data:
